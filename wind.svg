<style>
.line {
    fill: rgba(252,252,252,0.35);
}

.move {
    animation-name: moveRight;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes moveRight {
    from {
        transform: translateX(-1200px);
    }
    to {
        transform: translateX(0);
    }
}
</style>


